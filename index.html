<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestTracker — Øvrebyen Idrettsfag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--s1:#111118;--s2:#16161e;--s3:#1e1e28;
  --line:#252530;--line2:#32323e;
  --t0:#f2f2fa;--t1:#c0c0d8;--t2:#686880;--t3:#38384a;
  --up:#52d68a;--dn:#ff6b6b;--gold:#f5c842;--blue:#6096e8;
  --rad:10px;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t0);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:52px 1fr;height:100vh}

/* Topbar */
.tb{grid-column:1/-1;background:var(--s1);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:10}
.tb-logo{font-size:15px;font-weight:500;color:var(--t1);display:flex;align-items:center;gap:8px}
.tb-logo strong{color:var(--t0);font-weight:700}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 7px var(--up);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-btn{background:transparent;border:1px solid var(--line2);color:var(--t1);font-family:var(--sans);font-size:13px;padding:6px 13px;border-radius:7px;cursor:pointer;transition:all .14s}
.tb-btn:hover{background:var(--s3);color:var(--t0)}
.tb-btn.accent{background:var(--s3);color:var(--t0)}

/* Sidebar */
.sb{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-modes{padding:10px 10px 6px;display:flex;gap:3px}
.sb-mode{flex:1;padding:7px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--t2);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;text-align:center}
.sb-mode:hover{border-color:var(--t2);color:var(--t1)}
.sb-mode.on{background:var(--s3);border-color:var(--line2);color:var(--t0)}
.sb-sep{height:1px;background:var(--line);margin:4px 10px}
.sb-lbl{font-family:var(--mono);font-size:9.5px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;padding:8px 12px 3px}
.sb-list{flex:1;overflow-y:auto;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.kb{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 10px;border:none;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--t1);transition:all .1s;text-align:left;margin-bottom:1px}
.kb:hover{background:var(--s2);color:var(--t0)}
.kb.on{background:var(--s3);color:var(--t0)}
.kb-tag{font-family:var(--mono);font-size:11px;color:var(--t2);background:var(--s2);padding:2px 7px;border-radius:4px}
.kb.on .kb-tag{color:var(--up);background:rgba(82,214,138,.1)}
.sb-search{padding:6px 10px}
.sb-si{position:relative}
.sb-si-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:13px;pointer-events:none}
.sb-si input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:8px;color:var(--t0);font-family:var(--sans);font-size:13px;padding:7px 9px 7px 28px;outline:none;transition:border-color .14s}
.sb-si input::placeholder{color:var(--t3)}
.sb-si input:focus{border-color:var(--t2)}
.il{flex:1;overflow-y:auto;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ii{padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .1s;margin-bottom:1px}
.ii:hover{background:var(--s2)}
.ii.on{background:var(--s3)}
.ii-nm{font-size:14px;color:var(--t0);font-weight:500}
.ii-mt{font-family:var(--mono);font-size:10px;color:var(--t2);margin-top:1px}
.sb-admin{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:6px;transition:color .12s;border-top:1px solid var(--line);text-decoration:none}
.sb-admin:hover{color:var(--t1)}

/* Main */
.main{background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.per-strip{display:flex;align-items:center;gap:4px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--s1);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.per-strip::-webkit-scrollbar{display:none}
.per-lbl{font-family:var(--mono);font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.1em;margin-right:6px;white-space:nowrap;flex-shrink:0}
.pc{font-family:var(--sans);font-size:13px;font-weight:500;padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;transition:all .12s;white-space:nowrap}
.pc:hover{border-color:var(--t2);color:var(--t1)}
.pc.on{background:var(--s3);border-color:var(--t1);color:var(--t0)}
.stats{display:flex;gap:0;padding:14px 20px;flex-shrink:0;border-bottom:1px solid var(--line)}
.stat{flex:1;padding:0 14px;border-right:1px solid var(--line)}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:none}
.stat-n{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--t0);line-height:1;margin-bottom:4px}
.stat-l{font-size:12px;color:var(--t1);text-transform:uppercase;letter-spacing:.04em}
.miss{display:flex;align-items:center;gap:6px;padding:7px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
.miss-lbl{font-family:var(--mono);font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em}
.miss-chip{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid rgba(255,107,107,.25);background:rgba(255,107,107,.07);color:var(--dn)}
.miss-ok{font-family:var(--mono);font-size:11px;color:var(--up)}
.tbl-area{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.rt{width:100%;border-collapse:collapse}
.rt thead th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);padding:10px 10px 8px;text-align:left;border-bottom:2px solid var(--line2);background:var(--bg);position:sticky;top:0;z-index:2;white-space:nowrap;cursor:default}
.rt thead th.r{text-align:right}
.rt thead tr:last-child th{font-size:9.5px;padding:5px 10px 6px;border-bottom:1px solid var(--line)}
.rt tbody tr{border-bottom:1px solid var(--line2);cursor:pointer;transition:background .08s}
.rt tbody tr:hover{background:var(--s2)}
.rt tbody tr.on{background:var(--s3)}
.rt tbody td{padding:11px 10px;color:var(--t1);white-space:nowrap;font-size:15px}
.rt tbody td.nm{color:var(--t0);font-weight:600}
.rt tbody td.r{font-family:var(--mono);font-size:14px;text-align:right;color:var(--t0)}
.rt tbody td.miss{color:var(--t3);font-family:var(--mono);font-size:12px;border:none;padding:11px 10px}
.kj{font-family:var(--mono);font-size:10px;color:var(--t2);margin-left:5px}
.gr{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;border-radius:5px;font-family:var(--mono);font-size:13px;font-weight:700;padding:0 5px}
.g6{background:rgba(82,214,138,.15);color:var(--up)}
.g5{background:rgba(96,150,232,.15);color:var(--blue)}
.g4{background:rgba(200,222,255,.1);color:var(--t0)}
.g3{background:rgba(245,200,66,.1);color:var(--gold)}
.g2{background:rgba(255,107,107,.1);color:var(--dn)}
.empty-st{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t2);gap:6px;padding:40px}
.empty-st .ico{font-size:30px;opacity:.3;margin-bottom:6px}
.empty-st .msg{font-size:15px;color:var(--t1)}
.empty-st .sub{font-size:13px}

/* Panel */
.panel{position:fixed;top:52px;right:0;width:420px;height:calc(100vh - 52px);background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:20;overflow-y:auto}
.panel.open{transform:translateX(0)}
.p-hdr{padding:20px 18px 16px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.p-nm{font-size:22px;font-weight:700;color:var(--t0);margin-bottom:3px;line-height:1.2;padding-right:36px}
.p-mt{font-family:var(--mono);font-size:11px;color:var(--t2)}
.p-close{position:absolute;top:14px;right:14px;background:var(--s3);border:1px solid var(--line);color:var(--t1);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.p-close:hover{background:var(--s2);color:var(--t0)}
.p-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.p-sec-title{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2)}
.p-row:last-child{border-bottom:none}
.p-test{font-size:14px;color:var(--t1);display:flex;align-items:center;gap:8px}
.p-ico{font-size:15px;opacity:.7;width:20px;text-align:center}
.p-val{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--t0);display:flex;align-items:center;gap:8px}
.p-empty{color:var(--t3);font-size:12px;font-family:var(--mono)}
.p-per-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:10px}
.p-pt{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;transition:all .11s}
.p-pt:hover{border-color:var(--t2);color:var(--t1)}
.p-pt.on{background:var(--s3);border-color:var(--line2);color:var(--t0)}
.overlay{display:none;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.35);z-index:15;backdrop-filter:blur(1px)}
.overlay.on{display:block}
@keyframes fu{from{opacity:0}to{opacity:1}}
.rt tbody tr{animation:fu .2s ease forwards}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
</style>
</head>
<body>
<div class="shell">
<header class="tb">
  <div class="tb-logo"><div class="tb-dot"></div>Øvrebyen Idrettsfag &nbsp;<strong>TestTracker</strong></div>
  <div class="tb-r">
    <button class="tb-btn" id="cmp-btn" onclick="toggleCmp()">⇄ Sammenlign</button>
    <a href="testtracker.html" class="tb-btn accent" style="text-decoration:none">Fullversjon →</a>
  </div>
</header>
<aside class="sb">
  <div class="sb-modes">
    <button class="sb-mode on" id="m-k" onclick="setMode('klasse')">Klasse</button>
    <button class="sb-mode" id="m-i" onclick="setMode('individ')">Individ</button>
  </div>
  <div class="sb-sep"></div>
  <div id="klasse-side">
    <div class="sb-lbl">Aktive kull</div>
    <div class="sb-list" id="kull-list"></div>
  </div>
  <div id="individ-side" style="display:none;flex:1;overflow:hidden;flex-direction:column">
    <div class="sb-search"><div class="sb-si">
      <span class="sb-si-icon">⌕</span>
      <input id="search-in" placeholder="Søk elev…" oninput="searchStudents(this.value)" autocomplete="off">
    </div></div>
    <div class="il" id="indiv-list"></div>
  </div>
  <a href="testtracker.html" class="sb-admin">
    <span style="opacity:.5">⚙</span> Registrer / administrer
  </a>
</aside>
<main class="main" id="main">
  <div class="per-strip" id="per-strip"><span class="per-lbl">Periode</span></div>
  <div class="stats" id="stats">
    <div class="stat"><div class="stat-n" id="sn">—</div><div class="stat-l">Elever</div></div>
    <div class="stat"><div class="stat-n" id="sb_">—</div><div class="stat-l">Beep snitt</div></div>
    <div class="stat"><div class="stat-n" id="sl">—</div><div class="stat-l">3000m snitt</div></div>
    <div class="stat"><div class="stat-n" id="sf40">—</div><div class="stat-l">40m snitt</div></div>
    <div class="stat"><div class="stat-n" id="sk">—</div><div class="stat-l">Snittkarakter</div></div>
  </div>
  <div class="miss" id="miss" style="display:none"></div>
  <div class="tbl-area">
    <table class="rt">
      <thead id="rt-head"></thead>
      <tbody id="rt-body"></tbody>
    </table>
    <div class="empty-st" id="empty-st" style="display:none">
      <div class="ico">🏃</div>
      <div class="msg" id="empty-msg">Velg kull for å se resultater</div>
      <div class="sub">Bruk sidepanelet til venstre</div>
    </div>
  </div>
</main>
</div>
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<aside class="panel" id="panel">
  <div class="p-hdr">
    <div class="p-nm" id="p-nm">—</div>
    <div class="p-mt" id="p-mt">—</div>
    <button class="p-close" onclick="closePanel()">✕</button>
  </div>
  <div id="p-body"></div>
</aside>

function beepToTotal(s){
  if(!s)return null;
  s=String(s).trim();

  let m=s.match(/^(\d+)\.(\d+)$/);
  if(m){const lv=+m[1],sh=+m[2];
    if(sh<=0||sh>(BS[lv]||0))return null;
    let t=0;for(let l=1;l<lv;l++)t+=BS[l]||0;return t+sh;}
  // level+shuttle e.g. '9+2'
  m=s.match(/^(\d+)\+(\d+)$/);
  if(m){const lv=+m[1],sh=+m[2];let t=0;for(let l=1;l<lv;l++)t+=BS[l]||0;return t+sh;}
  // plain level e.g. '11'
  m=s.match(/^(\d+)$/);
  if(m){const lv=+m[1];let t=0;for(let l=1;l<=lv;l++)t+=BS[l]||0;return t;}
  return null;
}

function gradeNum(g) {
  if(!g) return -1;
  const base = parseFloat(g);
  const mod = g.endsWith('+') ? 0.3 : g.endsWith('-') ? -0.3 : 0;
  return base + mod;
}

function karPullupG(val, vg) {

function karPullupFull(pd, kj, vg, kull, per) {

    return {grade: g, note: 'Pull-up'};

  const uten   = pd.Hangup;
  const gStrikk = strikk ? karPullupJStrikk(strikk, vg) : null;

  return null;

  const base = Math.round(n);
  const diff = n - base;
  if(diff > 0.15) return base + '+';
  if(diff < -0.15) return base + '-';
  return String(base);
}

function avgGrades(grades) {
  const nums = grades.map(gradeToNum).filter(n => n !== null);
  if(!nums.length) return null;
  return nums.reduce((a,b) => a+b, 0) / nums.length;
}

function loadDNF() {
  try { return JSON.parse(localStorage.getItem(DNF_KEY) || '{}'); } catch { return {}; }
}

function isDNF(kull, navn) {
  const d = loadDNF();
  return !!(d[kull] && d[kull].includes(navn));
}

// ── Session overlay ──────────────────────────────────────────────────
function loadSes(){try{return JSON.parse(localStorage.getItem(SESS_KEY)||'[]');}catch{return[];}}
function applySession(d){
  loadSes().forEach(s=>{
    const kd=d[s.kull];if(!kd)return;
    const st=kd.students[s.navn];if(!st)return;
    if(!st.perioder[s.periode])st.perioder[s.periode]={};
    const p=st.perioder[s.periode],T=s.test;
    if(T==='Beep')p.Beep=s.val;
    else if(T==='Løp (2000m)'){p.Løp=s.val;p.LøpTest='2000m';}
    else if(T==='Løp (3000m)'){p.Løp=s.val;p.LøpTest='3000m';}
    else if(T==='Stake'){p.Løp=s.val;p.LøpTest='Stake';}
    else if(T==='Ro'){p.Løp=s.val;p.LøpTest='Ro';}
    else if(T==='Sykkel'){p.Løp=s.val;p.LøpTest='Sykkel';}
    else if(T==='Stillelengde')p.Stillelengde=s.val;
    else if(T==='40-meter')p['40-meter']=s.val;
    else if(T==='Benk'){p.Benk=s.val;if(s.kg)p.BenkKg=s.kg;}
    else if(T==='Pull-up')p.Hangup=s.val;
    else if(T==='Pull-up m/strikk')p.HangupStrikk=s.val;
  });
}
applySession(BASE_DATA);

// ── State ────────────────────────────────────────────────────────────
let mode='klasse', curKull='2023-26', curPer='', cmpPer='', selRow=null;

// ── Helpers ──────────────────────────────────────────────────────────
function getMD(k){return BASE_DATA[k];}
function gc(g){
  if(!g)return '';
  const n=Math.floor(gradeToNum(g)||0);
  return n>=6?'g6':n>=5?'g5':n>=4?'g4':n>=3?'g3':'g2';
}
function gradeCell(g){
  if(!g)return '<span class="p-empty">—</span>';
  return `<span class="gr ${gc(g)}">${g}</span>`;
}
function computeGrade(pd,kj,kull,per){
  if(!pd)return null;
  const vg=karVG(per)||'VG3';
  const gs=[];
  const gB=karBeep(pd.Beep,kj,vg);if(gB)gs.push(gB);
  const gL=pd.Løp&&pd.LøpTest==='3000m'?karLop3(pd.Løp,kj,vg):null;if(gL)gs.push(gL);
  const gS=karStille(pd.Stillelengde,kj,vg);if(gS)gs.push(gS);
  const g4=kar40m(pd['40-meter'],kj,vg);if(g4)gs.push(g4);
  const gP=karPullupFull(pd,kj,vg,kull,per)?.grade;if(gP)gs.push(gP);
  const avg=avgGrades(gs);
  return avg!==null?numToGrade(avg):null;
}
function lopLabel(lt){
  if(!lt||lt==='3000m')return lt||'';
  if(lt==='2000m')return '2000m';
  return lt.toLowerCase();
}
function dash(){return '<span class="miss">—</span>';}

// ── Kull list ────────────────────────────────────────────────────────
function buildKullList(){
  const el=document.getElementById('kull-list');
  el.innerHTML='';
  const groups=[{label:'Aktive',kulls:ACTIVE_KULLS},{label:'Historisk',kulls:OLD_KULLS}];
  groups.forEach(g=>{
    const lbl=document.createElement('div');lbl.className='sb-lbl';lbl.style.paddingTop='6px';lbl.textContent=g.label;el.appendChild(lbl);
    g.kulls.forEach(k=>{
      const kd=getMD(k);if(!kd)return;
      const btn=document.createElement('button');btn.className='kb'+(k===curKull?' on':'');btn.dataset.kull=k;
      const vg=ACTIVE_CURR[k]?ACTIVE_CURR[k].replace('Vår ','').replace('Høst ',''):'Ferdig';
      btn.innerHTML=`<span>${k.replace('-','–')}</span><span class="kb-tag">${vg}</span>`;
      btn.onclick=()=>selectKull(k);el.appendChild(btn);
    });
  });
}

// ── Student list (individ mode) ───────────────────────────────────────
let allStudents=[];
function buildStudentList(){
  if(allStudents.length)return;
  Object.keys(BASE_DATA).forEach(kull=>{
    const kd=getMD(kull);
    Object.values(kd.students).forEach(s=>{
      if(isDNF(kull,s.navn))return;
      const parts=s.navn.split(' ');
      const last=parts[parts.length-1],first=parts.slice(0,-1).join(' ');
      allStudents.push({kull,navn:s.navn,display:last+', '+first,key:(last+' '+first).toLowerCase()});
    });
  });
  allStudents.sort((a,b)=>a.display.localeCompare(b.display,'no'));
  renderStudentList(allStudents);
}
function renderStudentList(list){
  const el=document.getElementById('indiv-list');el.innerHTML='';
  const shown=list.slice(0,100);
  shown.forEach(item=>{
    const div=document.createElement('div');div.className='ii';
    div.innerHTML=`<div class="ii-nm">${item.display}</div><div class="ii-mt">${item.kull.replace('-','–')}</div>`;
    div.onclick=()=>openIndivid(item.kull,item.navn);el.appendChild(div);
  });
  if(list.length>100){
    const m=document.createElement('div');
    m.style.cssText='padding:6px 8px;font-size:11px;color:var(--t2);font-family:var(--mono)';
    m.textContent=`+ ${list.length-100} — søk for å filtrere`;el.appendChild(m);
  }
}
function searchStudents(q){
  if(!q.trim()){renderStudentList(allStudents);return;}
  const ql=q.toLowerCase();renderStudentList(allStudents.filter(s=>s.key.includes(ql)));
}

// ── Select kull ──────────────────────────────────────────────────────
function selectKull(kull){
  curKull=kull;cmpPer='';
  document.getElementById('cmp-btn').textContent='⇄ Sammenlign';
  const kd=getMD(kull);
  const periods=[...new Set(kd.periods||[])].sort((a,b)=>PERIOD_ORDER.indexOf(a)-PERIOD_ORDER.indexOf(b));
  curPer=ACTIVE_CURR[kull]||periods[0]||'';
  document.querySelectorAll('.kb').forEach(b=>b.classList.toggle('on',b.dataset.kull===kull));
  buildPeriodStrip(periods);
  renderTable();
}

// ── Period strip ─────────────────────────────────────────────────────
function buildPeriodStrip(periods){
  const el=document.getElementById('per-strip');
  el.innerHTML='<span class="per-lbl">Periode</span>';
  periods.forEach(p=>{
    const btn=document.createElement('button');btn.className='pc'+(p===curPer?' on':'');btn.textContent=p;btn.dataset.per=p;
    btn.onclick=()=>{
      document.querySelectorAll('.pc').forEach(c=>c.classList.toggle('on',c.dataset.per===p));
      curPer=p;cmpPer='';document.getElementById('cmp-btn').textContent='⇄ Sammenlign';renderTable();
    };
    el.appendChild(btn);
  });
}

// ── Render table ─────────────────────────────────────────────────────
function renderTable(){
  const kd=getMD(curKull);if(!kd){showEmpty('Velg kull i sidepanelet');return;}
  document.getElementById('empty-st').style.display='none';
  document.getElementById('per-strip').style.display='flex';
  document.getElementById('stats').style.display='flex';
  const hasCmp=!!cmpPer;

  const students=Object.values(kd.students)
    .filter(s=>!isDNF(curKull,s.navn))
    .sort((a,b)=>a.navn.split(' ').pop().localeCompare(b.navn.split(' ').pop(),'no'));

  // Header
  const thead=document.getElementById('rt-head');
  if(!hasCmp){
    thead.innerHTML=`<tr>
      <th style="width:28px">#</th><th>Elev</th>
      <th class="r">Beep</th><th class="r">Løp</th><th class="r">Stille</th>
      <th class="r">40m</th><th class="r">Benk</th><th class="r">Hangups</th><th>Kar.</th></tr>`;
  } else {
    // cmpPer = older (left, dimmed), curPer = newer (right, bright)
    const tests = ['Beep','Løp','Stille','40m','Benk','Hangups'];
    // Row 1: # Elev | test×colspan2 each | Kar  → 1+1 + 6×2 + 1 = 15
    // Row 2: blank×2 | per-label per test × 6 | blank×1 → 2 + 12 + 1 = 15
    const row1 = `<tr>
      <th style="width:28px">#</th>
      <th>Elev</th>
      ${tests.map(t=>`<th colspan="2" style="text-align:center;font-size:11px;color:var(--t1);
          border-bottom:2px solid var(--line2);padding-bottom:4px">${t}</th>`).join('')}
      <th>Kar.</th></tr>`;
    const row2 = `<tr style="background:var(--s2)">
      <th colspan="2" style="border-bottom:1px solid var(--line)"></th>
      ${tests.map(()=>`
        <th class="r" style="color:var(--t2);font-size:10px;font-weight:400;
            border-bottom:1px solid var(--line);padding:4px 10px 4px 0">${cmpPer}</th>
        <th class="r" style="color:var(--t0);font-size:10px;font-weight:600;
            border-bottom:1px solid var(--line);border-left:1px solid var(--line2);
            padding:4px 10px 4px 6px">${curPer}</th>`).join('')}
      <th style="border-bottom:1px solid var(--line)"></th></tr>`;
    thead.innerHTML = row1 + row2;
  }

  // Build rows
  const tbody=document.getElementById('rt-body');tbody.innerHTML='';
  let beeps=[],lops=[],f40s=[],kars=[];
  let miss={beep:0,lop:0,stil:0,f40:0,benk:0,pu:0};

  students.forEach((s,i)=>{
    const pd=s.perioder?.[curPer]||{};
    const cpd=hasCmp?s.perioder?.[cmpPer]||{}:{};
    const kj=s.kjønn;
    const last=s.navn.split(' ').pop();
    const first=s.navn.split(' ').slice(0,-1).join(' ');

    const beep=pd.Beep||'';
    const lop=pd.Løp?(pd.Løp+(pd.LøpTest&&pd.LøpTest!=='3000m'?` (${lopLabel(pd.LøpTest)})`:'')):'';
    const stil=pd.Stillelengde?parseFloat(pd.Stillelengde).toFixed(2):'';
    const f40=pd['40-meter']||'';
    const benk=pd.Benk?(pd.Benk+(pd.BenkKg?'@'+pd.BenkKg:'')):'';
    // Hangups: number prominent, label below in small muted text
    const pu=(()=>{
      const lines=[];
      if(pd.Hangup&&pd.Hangup!==''&&pd.Hangup!=='0')
        lines.push({n:pd.Hangup, lbl:pd.HangupStrikk?'':''});
      if(pd.HangupStrikk&&pd.HangupStrikk!=='')
        lines.push({n:pd.HangupStrikk, lbl:'m/strikk'});
      if(pd.Kroppshev&&pd.Kroppshev!==''&&pd.Kroppshev!=='0')
        lines.push({n:pd.Kroppshev, lbl:'liggende ro'});
      if(!lines.length) return '';
      return lines.map(({n,lbl})=>
        lbl
          ? `<span style="line-height:1.1">${n}<br><span style="font-size:10px;font-weight:400;color:var(--t2);font-family:var(--sans)">${lbl}</span></span>`
          : n
      ).join('<span style="color:var(--t3);margin:0 3px">·</span>');
    })();
    const gAvg=computeGrade(pd,kj,curKull,curPer);

    if(beep)beeps.push(beepToTotal(beep)||0);
    if(pd.Løp&&pd.LøpTest==='3000m'){const[mm,ss]=pd.Løp.split(':');lops.push(parseInt(mm)*60+parseInt(ss));}
    if(f40)f40s.push(parseFloat(f40));
    if(gAvg)kars.push(gradeToNum(gAvg)||0);
    if(!beep)miss.beep++;if(!pd.Løp)miss.lop++;if(!stil)miss.stil++;
    if(!f40)miss.f40++;if(!pd.Benk)miss.benk++;if(!pd.Hangup&&!pd.HangupStrikk)miss.pu++;

    function pair(cur,prev,lower){
      if(!hasCmp)return '';
      const cn=parseFloat(cur),pn=parseFloat(prev);
      let arrow='';
      if(cn&&pn){const b=lower?(cn<pn):(cn>pn),w=lower?(cn>pn):(cn<pn);
        arrow=b?`<span style="color:var(--up);font-size:11px"> ↑</span>`:w?`<span style="color:var(--dn);font-size:11px"> ↓</span>`:'';
      }
      return `<td class="r" style="color:var(--t2);font-size:12px">${prev||'—'}</td><td class="r">${cur||'<span class="miss">—</span>'}${arrow}</td>`;
    }

    const tr=document.createElement('tr');
    // no animation delay - all rows visible immediately
    if(!hasCmp){
      tr.innerHTML=`
        <td class="r" style="color:var(--t2);font-size:12px">${i+1}</td>
        <td class="nm">${last}, ${first}<span class="kj">${kj==='G'?'♂':'♀'}</span></td>
        <td class="r">${beep||dash()}</td>
        <td class="r">${lop||dash()}</td>
        <td class="r">${stil||dash()}</td>
        <td class="r">${f40||dash()}</td>
        <td class="r">${benk||dash()}</td>
        <td class="r" style="text-align:left;padding-right:6px;vertical-align:middle;line-height:1.3">${pu||dash()}</td>
        <td>${gradeCell(gAvg)}</td>`;
    } else {
      const cpd2=hasCmp?s.perioder?.[cmpPer]||{}:{};
      const cbeep=cpd2.Beep||'',clop=cpd2.Løp||'',cstil=cpd2.Stillelengde?parseFloat(cpd2.Stillelengde).toFixed(2):'',
            cf40=cpd2['40-meter']||'',cbenk=cpd2.Benk||'',cpu=kj==='G'?(cpd2.Hangup||''):[cpd2.Hangup?cpd2.Hangup+' pu':'',cpd2.HangupStrikk?cpd2.HangupStrikk+' s':''].filter(Boolean).join('/');
      tr.innerHTML=`
        <td class="r" style="color:var(--t2);font-size:12px">${i+1}</td>
        <td class="nm">${last}, ${first}<span class="kj">${kj==='G'?'♂':'♀'}</span></td>
        ${pair(beep,cbeep,false)}${pair(pd.Løp,clop,true)}${pair(stil,cstil,false)}${pair(f40,cf40,true)}${pair(pd.Benk,cbenk,false)}${pair(pd.Hangup||pd.Kroppshev||'',cpd2.Hangup||cpd2.Kroppshev||'',false)}
        <td>${gradeCell(gAvg)}</td>`;
    }
    tr.onclick=()=>openPanel(s,curKull,curPer,tr);
    tbody.appendChild(tr);
  });

  // Stats
  const N=students.length;
  document.getElementById('sn').textContent=N;
  document.getElementById('sb_').textContent=beeps.length?(beeps.reduce((a,b)=>a+b)/beeps.length).toFixed(1):'—';
  if(lops.length){const a=Math.round(lops.reduce((a,b)=>a+b)/lops.length);document.getElementById('sl').textContent=`${Math.floor(a/60)}:${String(a%60).padStart(2,'0')}`;}
  else document.getElementById('sl').textContent='—';
  document.getElementById('sf40').textContent=f40s.length?(f40s.reduce((a,b)=>a+b)/f40s.length).toFixed(2):'—';
  document.getElementById('sk').textContent=kars.length?numToGrade(kars.reduce((a,b)=>a+b)/kars.length)||'—':'—';

  // Missing banner
  const missEl=document.getElementById('miss');
  const chips=Object.entries(miss).filter(([k,v])=>v>0&&v<N).map(([k,v])=>`<span class="miss-chip">${k}: ${v} mangler</span>`);
  if(chips.length){missEl.style.display='flex';missEl.innerHTML='<span class="miss-lbl">Mangler</span>'+chips.join('');}
  else if(N>0){missEl.style.display='flex';missEl.innerHTML=`<span class="miss-ok">✓ Alle ${N} elever har komplette resultater for ${curPer}</span>`;}
  else missEl.style.display='none';
}

// ── Panel ─────────────────────────────────────────────────────────────
function openPanel(s,kull,per,tr){
  if(selRow){selRow.classList.remove('on');}selRow=tr;tr.classList.add('on');
  renderPanel(s,kull,per);
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('on');
}
function openIndivid(kull,navn){
  const kd=getMD(kull);const s=kd.students[navn];if(!s)return;
  const per=ACTIVE_CURR[kull]||(kd.periods||[]).slice(-1)[0]||'';
  renderPanel(s,kull,per);
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('on');
  document.querySelectorAll('.ii').forEach(el=>el.classList.toggle('on',el.querySelector('.ii-nm')?.textContent?.includes(navn.split(' ').pop())));
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
  if(selRow){selRow.classList.remove('on');selRow=null;}
}
function renderPanel(s,kull,activePer){
  const parts=s.navn.split(' ');
  document.getElementById('p-nm').textContent=parts.pop()+', '+parts.join(' ');
  document.getElementById('p-mt').textContent=`Kull ${kull.replace('-','–')} · ${s.kjønn==='G'?'♂ Gutt':'♀ Jente'}`;
  const REAL=['Beep','Løp','Stillelengde','40-meter','Benk','Hangup','HangupStrikk'];
  const hasDat=p=>REAL.some(f=>{const v=s.perioder?.[p]?.[f];return v&&v!='';});
  const pers=PERIOD_ORDER.filter(p=>hasDat(p));
  let html='';
  if(pers.length>1){
    html+='<div class="p-sec"><div class="p-section-title" style="font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);margin-bottom:8px">Periode</div><div class="p-per-tabs">';
    pers.forEach(p=>html+=`<button class="p-pt${p===activePer?' on':''}" onclick="switchPanelPer(this,'${p}')">${p}</button>`);
    html+='</div></div>';
  }
  pers.forEach(p=>html+=buildPanelPer(s,kull,p,p===activePer));
  document.getElementById('p-body').innerHTML=html;
}
function buildPanelPer(s,kull,per,isActive){
  const pd=s.perioder?.[per]||{};const kj=s.kjønn;const vg=karVG(per)||'VG3';
  const gAvg=computeGrade(pd,kj,kull,per);
  const gB=karBeep(pd.Beep,kj,vg),gL=pd.Løp&&pd.LøpTest==='3000m'?karLop3(pd.Løp,kj,vg):null,
        gS=karStille(pd.Stillelengde,kj,vg),g4=kar40m(pd['40-meter'],kj,vg),
        gP=karPullupFull(pd,kj,vg,kull,per);
  const row=(ico,lbl,val,g)=>`<div class="p-row">
    <div class="p-test"><span class="p-ico">${ico}</span>${lbl}</div>
    <div class="p-val">${val?val:'<span class="p-empty">—</span>'}${g?gradeCell(g.grade||g):''}</div></div>`;
  let c='';
  if(pd.Beep)c+=row('📡','Beep',pd.Beep,gB);
  if(pd.Løp)c+=row('🏃',lopLabel(pd.LøpTest)||'Løp',pd.Løp,gL);
  if(pd.Stillelengde)c+=row('📏','Stillelengde',parseFloat(pd.Stillelengde).toFixed(2)+'m',gS);
  if(pd['40-meter'])c+=row('⚡','40-meter',pd['40-meter']+'s',g4);
  if(pd.Benk)c+=row('💪','Benk',pd.Benk+(pd.BenkKg?' reps @ '+pd.BenkKg+'kg':' reps'),null);
  // Show all hangup variants present for this period
  if(pd.Hangup&&pd.Hangup!==''&&pd.Hangup!=='0')
    c+=row('🔝','Pull-up',pd.Hangup+' reps',gP);
  if(pd.HangupStrikk&&pd.HangupStrikk!=='')
    c+=row('🔝','Pull-up m/strikk',pd.HangupStrikk+' reps',gP);
  if(pd.Kroppshev&&pd.Kroppshev!==''&&pd.Kroppshev!=='0')
    c+=row('🔝','Liggende ro',pd.Kroppshev+' reps',null);
  if(!c)return '';
  return `<div class="p-sec" data-per="${per}">
    <div class="p-sec-title">${per}${gAvg?gradeCell(gAvg):''}</div>${c}</div>`;
}
function switchPanelPer(btn,per){
  document.querySelectorAll('.p-pt').forEach(b=>b.classList.toggle('on',b===btn));
  document.querySelector(`.p-sec[data-per="${per}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ── Mode ──────────────────────────────────────────────────────────────
function setMode(m){
  mode=m;
  document.getElementById('m-k').classList.toggle('on',m==='klasse');
  document.getElementById('m-i').classList.toggle('on',m==='individ');
  document.getElementById('klasse-side').style.display=m==='klasse'?'block':'none';
  const iSide=document.getElementById('individ-side');
  iSide.style.display=m==='individ'?'flex':'none';
  iSide.style.flexDirection='column';
  if(m==='individ'){
    buildStudentList();
    showEmpty('Søk eller velg en elev');
    document.getElementById('per-strip').style.display='none';
    document.getElementById('stats').style.display='none';
    document.getElementById('miss').style.display='none';
  } else {
    selectKull(curKull);
  }
}
function showEmpty(msg){
  document.getElementById('empty-st').style.display='flex';
  document.getElementById('empty-msg').textContent=msg;
  document.getElementById('rt-head').innerHTML='';
  document.getElementById('rt-body').innerHTML='';
}

// ── Compare ───────────────────────────────────────────────────────────
function toggleCmp(){
  if(cmpPer){cmpPer='';document.getElementById('cmp-btn').textContent='⇄ Sammenlign';renderTable();return;}
  const kd=getMD(curKull);
  const pers=PERIOD_ORDER.filter(p=>(kd.periods||[]).includes(p));
  const idx=pers.indexOf(curPer);
  if(idx<pers.length-1){cmpPer=pers[idx+1];document.getElementById('cmp-btn').textContent=`⇄ ${cmpPer} · Avslutt`;renderTable();}
}

// ── Init ──────────────────────────────────────────────────────────────
buildKullList();
selectKull('2023-26');
</script>
