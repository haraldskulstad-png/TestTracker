<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestTracker — Øvrebyen Idrettsfag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--s1:#111118;--s2:#16161e;--s3:#1e1e28;--s4:#26263400;
  --line:#252530;--line2:#30303e;
  --t0:#ebebf5;--t1:#9898b0;--t2:#555568;--t3:#333344;
  --acc:#c8c8e8;
  --up:#52d68a;--dn:#ff6b6b;--gold:#f5c842;
  --blue:#6096e8;--blue2:#3b72cc;
  --rad:10px;
  --mono:'DM Mono',monospace;
  --sans:'DM Sans',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t0);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* Shell */
.shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:52px 1fr;height:100vh}

/* Topbar */
.topbar{grid-column:1/-1;background:var(--s1);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:10}
.tb-logo{font-size:13px;font-weight:500;color:var(--t1);display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.tb-logo strong{color:var(--t0);font-weight:600}
.tb-pulse{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up);animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-btn{background:transparent;border:1px solid var(--line2);color:var(--t1);font-family:var(--sans);font-size:12px;padding:5px 11px;border-radius:7px;cursor:pointer;transition:all .14s;white-space:nowrap}
.tb-btn:hover{background:var(--s3);color:var(--t0);border-color:var(--t2)}
.tb-btn.accent{background:var(--s3);border-color:var(--line2);color:var(--t0)}

/* Sidebar */
.sidebar{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-modes{padding:12px 12px 8px;display:flex;gap:3px}
.sb-mode{flex:1;padding:6px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--t2);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;transition:all .13s;text-align:center}
.sb-mode:hover{border-color:var(--t2);color:var(--t1)}
.sb-mode.on{background:var(--s3);border-color:var(--line2);color:var(--t0)}
.sb-sep{height:1px;background:var(--line);margin:4px 12px}
.sb-label{font-family:var(--mono);font-size:9.5px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;padding:8px 14px 3px}
.sb-search{padding:6px 12px}
.sb-search-wrap{position:relative}
.sb-search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:12px;pointer-events:none}
.sb-search-input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:8px;color:var(--t0);font-family:var(--sans);font-size:12px;padding:6px 9px 6px 28px;outline:none;transition:border-color .14s}
.sb-search-input::placeholder{color:var(--t3)}
.sb-search-input:focus{border-color:var(--t2)}
.sb-kulls{flex:1;overflow-y:auto;padding:0 8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.kull-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 8px;border:none;border-radius:7px;background:transparent;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--t1);transition:all .1s;text-align:left;margin-bottom:1px}
.kull-btn:hover{background:var(--s2);color:var(--t0)}
.kull-btn.on{background:var(--s3);color:var(--t0)}
.kull-tag{font-family:var(--mono);font-size:10px;color:var(--t2);background:var(--s2);padding:2px 6px;border-radius:4px;transition:all .1s}
.kull-btn.on .kull-tag{color:var(--up);background:rgba(82,214,138,.1)}
.sb-admin{margin-top:auto;padding:10px 12px;font-size:11.5px;color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:6px;transition:color .12s;border-top:1px solid var(--line);text-decoration:none}
.sb-admin:hover{color:var(--t1)}

/* Individual search results list */
.sb-indiv-list{flex:1;overflow-y:auto;padding:0 8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.indiv-item{padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .1s;margin-bottom:1px}
.indiv-item:hover{background:var(--s2)}
.indiv-item.on{background:var(--s3)}
.indiv-item-name{font-size:13px;color:var(--t0);font-weight:500}
.indiv-item-meta{font-family:var(--mono);font-size:10px;color:var(--t2);margin-top:1px}

/* Main */
.main{background:var(--bg);overflow:hidden;display:flex;flex-direction:column}

/* Period strip */
.per-strip{display:flex;align-items:center;gap:4px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--s1);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.per-strip::-webkit-scrollbar{display:none}
.per-lbl{font-family:var(--mono);font-size:9.5px;color:var(--t2);text-transform:uppercase;letter-spacing:.1em;margin-right:6px;white-space:nowrap}
.per-chip{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;transition:all .12s;white-space:nowrap}
.per-chip:hover{border-color:var(--t2);color:var(--t1)}
.per-chip.on{background:var(--s3);border-color:var(--t1);color:var(--t0)}

/* Stats bar */
.stats-bar{display:flex;gap:0;padding:14px 20px;flex-shrink:0;border-bottom:1px solid var(--line)}
.stat{flex:1;padding:0 14px;border-right:1px solid var(--line)}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:none}
.stat-n{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--t0);line-height:1;margin-bottom:3px}
.stat-l{font-size:10.5px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}

/* Table */
.table-area{flex:1;overflow-y:auto;padding:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt thead th{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:2;white-space:nowrap}
.rt thead th.r{text-align:right}
.rt thead th.cmp{color:var(--blue2)}
.rt tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:background .09s}
.rt tbody tr:hover{background:var(--s2)}
.rt tbody tr.on{background:var(--s3)}
.rt tbody td{padding:9px 10px;color:var(--t1);white-space:nowrap;vertical-align:middle}
.rt tbody td.nm{color:var(--t0);font-weight:500}
.rt tbody td.r{font-family:var(--mono);font-size:12px;text-align:right}
.rt tbody td.r.miss{color:var(--t3)}
.kj-b{font-family:var(--mono);font-size:9px;color:var(--t2);margin-left:5px}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:18px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:600;padding:0 4px}
.g6{background:rgba(82,214,138,.15);color:var(--up)}
.g5{background:rgba(96,150,232,.15);color:var(--blue)}
.g4{background:rgba(200,222,255,.1);color:var(--acc)}
.g3{background:rgba(245,200,66,.1);color:var(--gold)}
.g2{background:rgba(255,107,107,.1);color:var(--dn)}
.no-grade{color:var(--t3);font-family:var(--mono);font-size:11px}
.missing{color:var(--t3)}

/* Individual panel */
.panel{position:fixed;top:52px;right:0;width:400px;height:calc(100vh - 52px);background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:20;overflow-y:auto}
.panel.open{transform:translateX(0)}
.panel-hdr{padding:18px 18px 14px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.panel-name{font-size:19px;font-weight:600;color:var(--t0);margin-bottom:3px;line-height:1.2}
.panel-meta{font-family:var(--mono);font-size:11px;color:var(--t2)}
.panel-close{position:absolute;top:14px;right:14px;background:var(--s3);border:1px solid var(--line);color:var(--t1);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.panel-close:hover{background:var(--s2);color:var(--t0)}

/* Panel sections */
.p-section{padding:14px 18px;border-bottom:1px solid var(--line)}
.p-section-title{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);margin-bottom:10px}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.p-test{font-size:13px;color:var(--t1);display:flex;align-items:center;gap:8px}
.p-icon{font-size:14px;opacity:.7;width:20px;text-align:center}
.p-val{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--t0);display:flex;align-items:center;gap:6px}
.p-empty{color:var(--t3);font-size:11px}

/* Period tabs in panel */
.p-per-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.p-per-tab{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;transition:all .11s}
.p-per-tab:hover{border-color:var(--t2);color:var(--t1)}
.p-per-tab.on{background:var(--s3);border-color:var(--line2);color:var(--t0)}

/* Overlay */
.overlay{display:none;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.35);z-index:15;backdrop-filter:blur(1px)}
.overlay.on{display:block}

/* Missing count banner */
.miss-banner{padding:8px 20px;display:flex;align-items:center;gap:6px;flex-shrink:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.miss-chip{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:12px;border:1px solid rgba(255,107,107,.2);background:rgba(255,107,107,.06);color:var(--dn);white-space:nowrap}
.miss-label{font-family:var(--mono);font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.all-ok{font-family:var(--mono);font-size:10px;color:var(--up);padding:0 2px}

/* Fade-up rows */
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rt tbody tr{animation:fu .18s both}

/* Empty state */
.empty-st{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t2);gap:6px}
.empty-st .ico{font-size:28px;opacity:.3;margin-bottom:6px}
.empty-st .msg{font-size:14px}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
</style>
</head>
<body>
<div class="shell">

<!-- Topbar -->
<header class="topbar">
  <div class="tb-logo">
    <div class="tb-pulse"></div>
    Øvrebyen Idrettsfag &nbsp;<strong>TestTracker</strong>
  </div>
  <div class="tb-right">
    <button class="tb-btn" id="cmp-btn" onclick="toggleCmp()">⇄ Sammenlign</button>
    <button class="tb-btn accent" onclick="window.location='testtracker.html'">Fullversjon →</button>
  </div>
</header>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sb-modes">
    <button class="sb-mode on" id="m-klasse" onclick="setMode('klasse')">Klasse</button>
    <button class="sb-mode" id="m-individ" onclick="setMode('individ')">Individ</button>
  </div>
  <div class="sb-sep"></div>

  <!-- Klasse: kull list -->
  <div id="klasse-side">
    <div class="sb-label">Aktive kull</div>
    <div class="sb-kulls" id="kull-list"></div>
  </div>

  <!-- Individ: search + list -->
  <div id="individ-side" style="display:none;flex:1;overflow:hidden;display:none;flex-direction:column">
    <div class="sb-search">
      <div class="sb-search-wrap">
        <span class="sb-search-icon">⌕</span>
        <input class="sb-search-input" id="search-in" placeholder="Søk elev…" oninput="searchStudents(this.value)" autocomplete="off">
      </div>
    </div>
    <div class="sb-indiv-list" id="indiv-list"></div>
  </div>

  <a class="sb-admin" onclick="window.location='testtracker.html#reg'">
    <span style="opacity:.5">⚙</span> Registrer / administrer
  </a>
</aside>

<!-- Main -->
<main class="main" id="main">

  <!-- Period strip -->
  <div class="per-strip" id="per-strip">
    <span class="per-lbl">Periode</span>
  </div>

  <!-- Stats bar -->
  <div class="stats-bar" id="stats-bar">
    <div class="stat"><div class="stat-n" id="sn">—</div><div class="stat-l">Elever</div></div>
    <div class="stat"><div class="stat-n" id="sb">—</div><div class="stat-l">Beep snitt</div></div>
    <div class="stat"><div class="stat-n" id="sl">—</div><div class="stat-l">3000m snitt</div></div>
    <div class="stat"><div class="stat-n" id="sf40">—</div><div class="stat-l">40m snitt</div></div>
    <div class="stat"><div class="stat-n" id="sk">—</div><div class="stat-l">Snittkarakter</div></div>
  </div>

  <!-- Missing banner -->
  <div class="miss-banner" id="miss-banner" style="display:none"></div>

  <!-- Table -->
  <div class="table-area">
    <table class="rt" id="rt">
      <thead id="rt-head"></thead>
      <tbody id="rt-body"></tbody>
    </table>
    <div class="empty-st" id="empty-st" style="display:none">
      <div class="ico">🏃</div>
      <div class="msg">Velg kull for å se resultater</div>
    </div>
  </div>
</main>
</div>

<!-- Individual panel -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<aside class="panel" id="panel">
  <div class="panel-hdr">
    <div class="panel-name" id="p-name">—</div>
    <div class="panel-meta" id="p-meta">—</div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div id="p-body"></div>
</aside>

function beepToTotal(s){
  if(!s)return null;
  s=String(s).trim();
  // level.shuttle e.g. '10.5'
  let m=s.match(/^(\d+)\.(\d+)$/);
  if(m){const lv=+m[1],sh=+m[2];
    if(sh<=0||sh>(BS[lv]||0))return null;
    let t=0;for(let l=1;l<lv;l++)t+=BS[l]||0;return t+sh;}
  // level+shuttle e.g. '9+2'
  m=s.match(/^(\d+)\+(\d+)$/);
  if(m){const lv=+m[1],sh=+m[2];let t=0;for(let l=1;l<lv;l++)t+=BS[l]||0;return t+sh;}
  // plain level e.g. '11'
  m=s.match(/^(\d+)$/);
  if(m){const lv=+m[1];let t=0;for(let l=1;l<=lv;l++)t+=BS[l]||0;return t;}
  return null;
}

function karVG(per) {
  const m = per.match(/VG(\d)/);

}

  const scale = KAR_BEEP[kj]?.[vg]; if(!scale) return null;
  for(let i=KAR_GRADES.length-1;i>=0;i--) { if(t>=scale[i]) return KAR_GRADES[i]; }

}
function karLop3(val, kj, vg) {
  const p=String(val).split(':'); if(p.length!==2) return null;
  const sec=+p[0]*60+ +p[1];
  const scale=KAR_LOP3[kj]?.[vg]; if(!scale) return null;
  for(let i=KAR_GRADES.length-1;i>=0;i--) { if(sec<=scale[i]) return KAR_GRADES[i]; }
  return null;
}
function karStille(val, kj, vg) {
  const m=parseFloat(val); if(!m) return null;
  const cm=m>10?m:m*100;  // stored as meters, convert to cm
  const scale=KAR_STILLE[kj]?.[vg]; if(!scale) return null;
  for(let i=KAR_GRADES.length-1;i>=0;i--) { if(cm>=scale[i]) return KAR_GRADES[i]; }
  return null;
}

function gradeNum(g) {
  if(!g) return -1;
  const base = parseFloat(g);
  const mod = g.endsWith('+') ? 0.3 : g.endsWith('-') ? -0.3 : 0;
  return base + mod;
}
function karPullupG(val, vg) {
  const n = parseInt(val); if(isNaN(n)||n<=0) return null;
  const scale = KAR_PU.G[vg]; if(!scale) return null;
  return n >= scale._top ? '6' : (scale[n] || null);
}
function karPullupJStrikk(val, vg) {
  const n = parseInt(val); if(isNaN(n)||n<=0) return null;
  const scale = KAR_PU.G[vg]; if(!scale) return null;  // same as G
  return n >= scale._top ? '6' : (scale[n] || null);
}
function karPullupJUten(val) {
  const n = parseInt(val); if(isNaN(n)||n<=0) return null;
  return n >= KAR_PU.J_UTEN._top ? '6' : (KAR_PU.J_UTEN[n] || null);
}
function karPullupFull(pd, kj, vg, kull, per) {
  if(kj === 'G') {
    const pu = pd.Hangup; if(!pu && pu !== 0) return null;
    const g = karPullupG(pu, vg); if(!g) return null;
    return {grade: g, note: 'Pull-up'};
  }
  // Jente: check both strikk and uten
  const strikk = pd.HangupStrikk;
  const uten   = pd.Hangup;
  const gStrikk = strikk ? karPullupJStrikk(strikk, vg) : null;
  // Uten strikk only from Vår 2026 active kulls
  const ACTIVE_KULLS = ['2023-26','2024-27','2025-28'];
  const gUten = (uten && ACTIVE_KULLS.includes(kull))
    ? karPullupJUten(uten) : null;
  const best = bestGrade(gStrikk, gUten);
  if(!best) return null;
  if(gStrikk && gUten && gradeNum(gUten) > gradeNum(gStrikk)) {
    return {grade: best, note: `u/strikk ${gUten} > strikk ${gStrikk}`};
  }
  if(gStrikk) return {grade: best, note: `m/strikk`};
  if(gUten)   return {grade: best, note: `u/strikk`};
  return null;
}

function bestGrade(a, b) {
  if(!a && !b) return null;
  if(!a) return b; if(!b) return a;
  return gradeNum(a) >= gradeNum(b) ? a : b;
}

// Main entry point: grade pull-up result given period + student data
// Returns {grade, note} where note describes which variant was used
function gradeToNum(g) {
  if(!g) return null;
  const base = parseFloat(g);
  if(isNaN(base)) return null;
  if(g.endsWith('+')) return base + 0.33;
  if(g.endsWith('-')) return base - 0.33;
  return base;
}
function numToGrade(n) {
  if(n === null || isNaN(n)) return null;
  const base = Math.round(n);
  const diff = n - base;
  if(diff > 0.15) return base + '+';
  if(diff < -0.15) return base + '-';
  return String(base);
}
function avgGrades(grades) {
  const nums = grades.map(gradeToNum).filter(n => n !== null);
  if(!nums.length) return null;
  return nums.reduce((a,b) => a+b, 0) / nums.length;
}

    else if(T==='Løp (2000m)'){p.Løp=s.val;p.LøpTest='2000m';}
    else if(T==='Løp (3000m)'){p.Løp=s.val;p.LøpTest='3000m';}
    else if(T==='Stake'){p.Løp=s.val;p.LøpTest='Stake';}
    else if(T==='Ro'){p.Løp=s.val;p.LøpTest='Ro';}
    else if(T==='Sykkel'){p.Løp=s.val;p.LøpTest='Sykkel';}
    else if(T==='Stillelengde')p.Stillelengde=s.val;
    else if(T==='40-meter')p['40-meter']=s.val;
    else if(T==='Benk'){p.Benk=s.val;if(s.kg)p.BenkKg=s.kg;}
    else if(T==='Pull-up')p.Hangup=s.val;
    else if(T==='Pull-up m/strikk')p.HangupStrikk=s.val;
  });
}
applySession(BASE_DATA);

// ── State ────────────────────────────────────────────────────────────
let mode='klasse';
let curKull='2023-26';
let curPer=ACTIVE_CURR['2023-26'];
let cmpPer='';
let curStudent=null;
let curPanelPer='';
let allStudentList=[];  // for individ search
let selectedRow=null;

// ── Helpers ──────────────────────────────────────────────────────────
function getMD(kull){return BASE_DATA[kull];}

function getPd(s, per){
  return s.perioder?.[per] || {};
}

function gradeClass(g){
  if(!g) return '';
  return 'g'+Math.floor(gradeToNum(g)||0).toString().replace(/[^2-6]/g,'');
}
function gradeCell(g){
  if(!g) return '<span class="no-grade">—</span>';
  const base=String(Math.floor(gradeToNum(g)||0));
  return `<span class="grade ${gradeClass(g)}">${g}</span>`;
}

function computeGrade(pd, kj, kull, per){
  if(!pd) return null;
  const vg = karVG(per)||'VG3';
  const gs = [];
  const gB = karBeep(pd.Beep, kj, vg);
  if(gB) gs.push(gB);
  const gL = pd.Løp && pd.LøpTest==='3000m' ? karLop3(pd.Løp, kj, vg) : null;
  if(gL) gs.push(gL);
  const gS = karStille(pd.Stillelengde, kj, vg);
  if(gS) gs.push(gS);
  const g4 = kar40m(pd['40-meter'], kj, vg);
  if(g4) gs.push(g4);
  const gP = karPullupFull(pd, kj, vg, kull, per)?.grade;
  if(gP) gs.push(gP);
  const avg = avgGrades(gs);
  return avg !== null ? numToGrade(avg) : null;
}

function lopLabel(lt){
  if(!lt||lt==='3000m') return lt||'';
  if(lt==='2000m') return '2000m';
  if(lt==='Stake') return 'stake';
  if(lt==='Ro') return 'ro';
  if(lt==='Sykkel') return 'sykkel';
  return lt;
}

// ── Build kull list ──────────────────────────────────────────────────
function buildKullList(){
  const el = document.getElementById('kull-list');
  el.innerHTML = '';
  const groups = [
    {label:'Aktive', kulls:ACTIVE_KULLS},
    {label:'Historisk', kulls:OLD_KULLS},
  ];
  groups.forEach(g => {
    const lbl = document.createElement('div');
    lbl.className = 'sb-label';
    lbl.style.paddingTop = '8px';
    lbl.textContent = g.label;
    el.appendChild(lbl);
    g.kulls.forEach(k => {
      const kd = getMD(k); if(!kd) return;
      const btn = document.createElement('button');
      btn.className = 'kull-btn' + (k===curKull?' on':'');
      btn.dataset.kull = k;
      const vg = ACTIVE_CURR[k] ? ACTIVE_CURR[k].replace('Vår ','').replace('Høst ','') : 'Ferdig';
      btn.innerHTML = `<span>${k.replace('-','–')}</span><span class="kull-tag">${vg}</span>`;
      btn.onclick = () => selectKull(k);
      el.appendChild(btn);
    });
  });
}

// ── Build student list (individ mode) ───────────────────────────────
function buildStudentList(){
  allStudentList = [];
  Object.keys(BASE_DATA).forEach(kull => {
    const kd = getMD(kull);
    Object.values(kd.students).forEach(s => {
      if(isDNF(kull, s.navn)) return;
      const parts = s.navn.split(' ');
      const last = parts[parts.length-1];
      const first = parts.slice(0,-1).join(' ');
      allStudentList.push({
        kull, navn:s.navn,
        display: last+', '+first,
        searchKey: (last+' '+first).toLowerCase()
      });
    });
  });
  allStudentList.sort((a,b)=>a.display.localeCompare(b.display,'no'));
  renderStudentList(allStudentList);
}

function renderStudentList(list){
  const el = document.getElementById('indiv-list');
  el.innerHTML = '';
  list.slice(0,80).forEach(item => {
    const div = document.createElement('div');
    div.className = 'indiv-item' + (curStudent?.navn===item.navn&&curStudent?.kull===item.kull?' on':'');
    div.innerHTML = `<div class="indiv-item-name">${item.display}</div><div class="indiv-item-meta">${item.kull.replace('-','–')}</div>`;
    div.onclick = () => openIndivid(item.kull, item.navn);
    el.appendChild(div);
  });
  if(list.length > 80){
    const more = document.createElement('div');
    more.style.cssText = 'padding:6px 8px;font-size:10px;color:var(--t2);font-family:var(--mono)';
    more.textContent = `+ ${list.length-80} elever — søk for å filtrere`;
    el.appendChild(more);
  }
}

function searchStudents(q){
  if(!q.trim()){renderStudentList(allStudentList);return;}
  const ql = q.toLowerCase();
  renderStudentList(allStudentList.filter(s=>s.searchKey.includes(ql)));
}

// ── Select kull ──────────────────────────────────────────────────────
function selectKull(kull){
  curKull = kull;
  const kd = getMD(kull);
  // Period: newest first
  const allPers = [...(kd.periods||[])].sort((a,b)=>PERIOD_ORDER.indexOf(a)-PERIOD_ORDER.indexOf(b));
  const defPer = ACTIVE_CURR[kull] || allPers[0];
  curPer = defPer;
  cmpPer = '';
  document.querySelectorAll('.kull-btn').forEach(b=>b.classList.toggle('on',b.dataset.kull===kull));
  buildPeriodStrip(allPers, defPer);
  renderTable();
}

// ── Period strip ─────────────────────────────────────────────────────
function buildPeriodStrip(periods, active){
  const el = document.getElementById('per-strip');
  el.innerHTML = '<span class="per-lbl">Periode</span>';
  periods.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'per-chip'+(p===active?' on':'');
    btn.textContent = p;
    btn.dataset.per = p;
    btn.onclick = () => {
      document.querySelectorAll('.per-chip').forEach(c=>c.classList.toggle('on',c.dataset.per===p));
      curPer = p; cmpPer='';
      document.getElementById('cmp-btn').textContent='⇄ Sammenlign';
      renderTable();
    };
    el.appendChild(btn);
  });
}

// ── Render table (klasse mode) ───────────────────────────────────────
function renderTable(){
  const kd = getMD(curKull); if(!kd){showEmpty();return;}
  const vg = karVG(curPer)||'VG3';

  // Students sorted by lastname
  const students = Object.values(kd.students)
    .filter(s=>!isDNF(curKull,s.navn))
    .sort((a,b)=>{
      const la=a.navn.split(' ').pop(), lb=b.navn.split(' ').pop();
      return la.localeCompare(lb,'no');
    });

  // Build header
  const thead = document.getElementById('rt-head');
  const hasCmp = !!cmpPer;
  if(!hasCmp){
    thead.innerHTML=`<tr>
      <th style="width:30px">#</th>
      <th>Elev</th>
      <th class="r">Beep</th>
      <th class="r">Løp</th>
      <th class="r">Stille</th>
      <th class="r">40m</th>
      <th class="r">Benk</th>
      <th class="r">Pull-up</th>
      <th>Kar.</th>
    </tr>`;
  } else {
    const c = `<span style="color:var(--t2)">${cmpPer}</span>`;
    const n = `<span style="color:var(--t0)">${curPer}</span>`;
    thead.innerHTML=`<tr>
      <th style="width:30px">#</th>
      <th>Elev</th>
      <th class="r">Beep<br><span style="font-size:8px;opacity:.6">${cmpPer.slice(0,4)} → ${curPer.slice(0,4)}</span></th>
      <th class="r">Løp</th>
      <th class="r">Stille</th>
      <th class="r">40m</th>
      <th class="r">Benk</th>
      <th class="r">Pull-up</th>
      <th>Kar.</th>
    </tr>`;
  }

  // Build rows
  const tbody = document.getElementById('rt-body');
  tbody.innerHTML = '';
  let beeps=[], lops=[], f40s=[], kars=[];
  let missing = {beep:0,lop:0,stil:0,f40:0,benk:0,pu:0};

  students.forEach((s,i) => {
    const pd  = getPd(s, curPer);
    const cpd = hasCmp ? getPd(s, cmpPer) : null;
    const kj  = s.kjønn;

    const beep = pd.Beep||'';
    const lop  = pd.Løp||(pd.LøpTest?pd.LøpTest:'');
    const lopDisp = pd.Løp?(pd.Løp+(pd.LøpTest&&pd.LøpTest!=='3000m'?` <span style="font-size:10px;color:var(--t2)">(${lopLabel(pd.LøpTest)})</span>`:'')):'';
    const stil = pd.Stillelengde?(parseFloat(pd.Stillelengde)).toFixed(2):'';
    const f40  = pd['40-meter']||'';
    const benk = pd.Benk?(pd.Benk+(pd.BenkKg?' @'+pd.BenkKg:'')):'';
    const pu   = kj==='G'?(pd.Hangup||''):((pd.Hangup?pd.Hangup+' pu ':'')+(pd.HangupStrikk?pd.HangupStrikk+' s':''))||'';

    // Grade
    const gAvg = computeGrade(pd, kj, curKull, curPer);

    // Stats
    if(beep) beeps.push(beepToTotal(beep));
    if(pd.Løp && pd.LøpTest==='3000m'){const [mm,ss]=pd.Løp.split(':');lops.push(parseInt(mm)*60+parseInt(ss));}
    if(f40) f40s.push(parseFloat(f40));
    if(gAvg) kars.push(gradeToNum(gAvg));

    // Missing
    if(!beep) missing.beep++;
    if(!pd.Løp) missing.lop++;
    if(!stil) missing.stil++;
    if(!f40) missing.f40++;
    if(!pd.Benk) missing.benk++;
    if(!pd.Hangup&&!pd.HangupStrikk) missing.pu++;

    // Comparison cells
    function cmpPair(curVal, cmpGetter, lower){
      if(!hasCmp) return '';
      const cVal = cmpGetter(cpd||{});
      const cn = parseFloat(curVal||0), pn = parseFloat(cVal||0);
      let arrow = '';
      if(cn&&pn){
        const better = lower?(cn<pn):(cn>pn);
        const worse  = lower?(cn>pn):(cn<pn);
        arrow = better?`<span style="color:var(--up);font-size:10px"> ↑</span>`:
                worse ?`<span style="color:var(--dn);font-size:10px"> ↓</span>`:'';
      }
      return `<span style="color:var(--t2);font-size:11px;margin-right:4px">${cVal||'—'}</span>${curVal||'<span class="missing">—</span>'}${arrow}`;
    }

    const tr = document.createElement('tr');
    tr.style.animationDelay = `${Math.min(i*0.02,0.4)}s`;
    if(hasCmp){
      tr.innerHTML=`
        <td class="r" style="color:var(--t2);font-size:11px">${i+1}</td>
        <td class="nm">${s.navn.split(' ').pop()}, ${s.navn.split(' ').slice(0,-1).join(' ')}<span class="kj-b">${kj==='G'?'♂':'♀'}</span></td>
        <td class="r">${cmpPair(beep,p=>p.Beep||'')}</td>
        <td class="r">${cmpPair(pd.Løp,p=>p.Løp||'',true)}</td>
        <td class="r">${cmpPair(stil,p=>p.Stillelengde?(parseFloat(p.Stillelengde)).toFixed(2):'')}</td>
        <td class="r">${cmpPair(f40,p=>p['40-meter']||'',true)}</td>
        <td class="r">${cmpPair(pd.Benk,p=>p.Benk||'')}</td>
        <td class="r">${pu||'<span class="missing">—</span>'}</td>
        <td>${gradeCell(gAvg)}</td>`;
    } else {
      tr.innerHTML=`
        <td class="r" style="color:var(--t2);font-size:11px">${i+1}</td>
        <td class="nm">${s.navn.split(' ').pop()}, ${s.navn.split(' ').slice(0,-1).join(' ')}<span class="kj-b">${kj==='G'?'♂':'♀'}</span></td>
        <td class="r">${beep||'<span class="missing">—</span>'}</td>
        <td class="r">${lopDisp||'<span class="missing">—</span>'}</td>
        <td class="r">${stil||'<span class="missing">—</span>'}</td>
        <td class="r">${f40||'<span class="missing">—</span>'}</td>
        <td class="r">${benk||'<span class="missing">—</span>'}</td>
        <td class="r">${pu||'<span class="missing">—</span>'}</td>
        <td>${gradeCell(gAvg)}</td>`;
    }
    tr.onclick = () => openPanel(s, curKull, curPer, tr);
    tbody.appendChild(tr);
  });

  // Stats
  document.getElementById('sn').textContent = students.length;
  document.getElementById('sb').textContent = beeps.length?(beeps.reduce((a,b)=>a+b)/beeps.length).toFixed(1):'—';
  if(lops.length){const a=Math.round(lops.reduce((a,b)=>a+b)/lops.length);document.getElementById('sl').textContent=`${Math.floor(a/60)}:${String(a%60).padStart(2,'0')}`;}
  else document.getElementById('sl').textContent='—';
  document.getElementById('sf40').textContent = f40s.length?(f40s.reduce((a,b)=>a+b)/f40s.length).toFixed(2):'—';
  document.getElementById('sk').textContent = kars.length?numToGrade(kars.reduce((a,b)=>a+b)/kars.length)||'—':'—';

  // Missing banner
  const bannerEl = document.getElementById('miss-banner');
  const missingTests = Object.entries(missing)
    .filter(([k,v])=>v>0&&v<students.length)
    .map(([k,v])=>`<span class="miss-chip">${k}: ${v} mangler</span>`);
  if(missingTests.length){
    bannerEl.style.display='flex';
    bannerEl.innerHTML='<span class="miss-label">Mangler</span>'+missingTests.join('');
  } else {
    bannerEl.style.display='none';
  }
}

// ── Panel: student profile ───────────────────────────────────────────
function openPanel(s, kull, per, tr){
  if(selectedRow){selectedRow.classList.remove('on');selectedRow=null;}
  selectedRow=tr; tr.classList.add('on');
  curPanelPer = per;
  const kd = getMD(kull);
  renderPanelContent(s, kull, per);
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('on');
}

function openIndivid(kull, navn){
  const kd = getMD(kull);
  const s = kd.students[navn]; if(!s) return;
  // Switch to showing that student's kull table + open panel
  if(mode==='individ'){
    // find per with data
    const per = ACTIVE_CURR[kull]||kd.periods[kd.periods.length-1]||PERIOD_ORDER[0];
    renderPanelContent(s, kull, per);
    document.getElementById('panel').classList.add('open');
    document.getElementById('overlay').classList.add('on');
  }
  document.querySelectorAll('.indiv-item').forEach(el=>{
    el.classList.toggle('on', el.querySelector('.indiv-item-name')?.textContent?.includes(navn.split(' ').pop()));
  });
}

function renderPanelContent(s, kull, activePer){
  const parts = s.navn.split(' ');
  const last = parts[parts.length-1];
  const first = parts.slice(0,-1).join(' ');
  document.getElementById('p-name').textContent = last+', '+first;

  const vg = karVG(activePer)||'';
  const kd = getMD(kull);
  document.getElementById('p-meta').textContent = `Kull ${kull.replace('-','–')} · ${s.kjønn==='G'?'♂ Gutt':'♀ Jente'}`;

  // Build period tabs
  const periodsWithData = PERIOD_ORDER.filter(p=>{
    const pd=s.perioder?.[p];
    if(!pd) return false;
    return ['Beep','Løp','Stillelengde','40-meter','Benk','Hangup','HangupStrikk','Kroppshev'].some(f=>pd[f]&&pd[f]!=='');
  });

  const body = document.getElementById('p-body');
  let html = '';

  // Period selector tabs
  if(periodsWithData.length > 1){
    html += '<div class="p-section"><div class="p-section-title">Periode</div><div class="p-per-tabs">';
    periodsWithData.forEach(p=>{
      html += `<button class="p-per-tab${p===activePer?' on':''}" onclick="switchPanelPer(this,'${p}')">${p}</button>`;
    });
    html += '</div></div>';
  }

  // Current period data
  html += buildPanelPeriod(s, kull, activePer, true);

  // All other periods (career)
  periodsWithData.filter(p=>p!==activePer).forEach(p=>{
    html += buildPanelPeriod(s, kull, p, false);
  });

  body.innerHTML = html;
  body.dataset.s = JSON.stringify({navn:s.navn, kull});
}

function buildPanelPeriod(s, kull, per, isActive){
  const pd = s.perioder?.[per]||{};
  const kj = s.kjønn;
  const vg = karVG(per)||'VG3';
  const hasData = ['Beep','Løp','Stillelengde','40-meter','Benk','Hangup','HangupStrikk'].some(f=>pd[f]&&pd[f]!=='');
  if(!hasData) return '';

  const gAvg = computeGrade(pd, kj, kull, per);
  const gBeep = karBeep(pd.Beep, kj, vg);
  const gLop = pd.Løp&&pd.LøpTest==='3000m'?karLop3(pd.Løp,kj,vg):null;
  const gSt  = karStille(pd.Stillelengde, kj, vg);
  const g40  = kar40m(pd['40-meter'], kj, vg);
  const gPu  = karPullupFull(pd,kj,vg,kull,per);

  const row = (icon, lbl, val, grade)=>`
    <div class="p-row">
      <div class="p-test"><span class="p-icon">${icon}</span>${lbl}</div>
      <div class="p-val">
        ${val?`<span>${val}</span>`:`<span class="p-empty">—</span>`}
        ${grade?gradeCell(grade):''}
      </div>
    </div>`;

  let content = '';
  if(pd.Beep) content += row('📡','Beep',pd.Beep,gBeep);
  if(pd.Løp) content += row('🏃',pd.LøpTest?lopLabel(pd.LøpTest).toUpperCase()||'Løp':'Løp',pd.Løp,gLop);
  if(pd.Stillelengde) content += row('📏','Stillelengde',(parseFloat(pd.Stillelengde)).toFixed(2)+'m',gSt);
  if(pd['40-meter']) content += row('⚡','40-meter',pd['40-meter']+'s',g40);
  if(pd.Benk) content += row('💪','Benk',pd.Benk+(pd.BenkKg?' reps @ '+pd.BenkKg+'kg':' reps'),null);
  if(kj==='G'&&pd.Hangup) content += row('🔝','Pull-up',pd.Hangup+' reps',gPu?.grade||null);
  if(kj==='J'){
    if(pd.Hangup) content += row('🔝','Pull-up',pd.Hangup+' reps',null);
    if(pd.HangupStrikk) content += row('🔝','Pull-up m/strikk',pd.HangupStrikk+' reps',gPu?.grade||null);
  }

  return `<div class="p-section" data-per="${per}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="p-section-title">${per}</div>
      ${gAvg?gradeCell(gAvg):''}
    </div>
    ${content}
  </div>`;
}

function switchPanelPer(btn, per){
  document.querySelectorAll('.p-per-tab').forEach(b=>b.classList.toggle('on',b===btn));
  // Scroll to that section in panel
  const sec = document.querySelector(`.p-section[data-per="${per}"]`);
  if(sec) sec.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
  if(selectedRow){selectedRow.classList.remove('on');selectedRow=null;}
}

// ── Mode switch ──────────────────────────────────────────────────────
function setMode(m){
  mode = m;
  document.getElementById('m-klasse').classList.toggle('on',m==='klasse');
  document.getElementById('m-individ').classList.toggle('on',m==='individ');
  document.getElementById('klasse-side').style.display = m==='klasse'?'block':'none';
  document.getElementById('individ-side').style.display = m==='individ'?'flex':'none';

  if(m==='individ'){
    buildStudentList();
    document.getElementById('per-strip').style.display='none';
    document.getElementById('stats-bar').style.display='none';
    document.getElementById('miss-banner').style.display='none';
    document.getElementById('rt-head').innerHTML='';
    document.getElementById('rt-body').innerHTML='';
    document.getElementById('empty-st').style.display='flex';
    document.getElementById('empty-st').querySelector('.msg').textContent='Søk eller velg en elev';
  } else {
    document.getElementById('per-strip').style.display='flex';
    document.getElementById('stats-bar').style.display='flex';
    document.getElementById('empty-st').style.display='none';
    selectKull(curKull);
  }
}

// ── Compare toggle ───────────────────────────────────────────────────
function toggleCmp(){
  if(cmpPer){
    cmpPer='';
    document.getElementById('cmp-btn').textContent='⇄ Sammenlign';
    renderTable();
    return;
  }
  // Pick previous period
  const kd = getMD(curKull);
  const allPers = PERIOD_ORDER.filter(p=>kd.periods.includes(p));
  const curIdx = allPers.indexOf(curPer);
  if(curIdx < allPers.length-1){
    cmpPer = allPers[curIdx+1];
    document.getElementById('cmp-btn').textContent=`⇄ ${cmpPer} · Avslutt`;
    renderTable();
  }
}

function showEmpty(){
  document.getElementById('empty-st').style.display='flex';
}

// ── Init ─────────────────────────────────────────────────────────────
buildKullList();
selectKull('2023-26');
</script>
